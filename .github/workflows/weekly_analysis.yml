name: Weekly Freight Analysis

on:
  schedule:
    - cron: "0 15 * * 2"  # Tuesdays 15:00 UTC (after EIA publishes)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
          NOAA_USER_AGENT: "(freight-leading-indicators, ${{ secrets.CONTACT_EMAIL }})"
        run: python src/run_pipeline.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ data/processed/
          git diff --staged --quiet || git commit -m "Analysis run: $(date +%Y-%m-%d)"
          git push
